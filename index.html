<!--
  Site navigation, added at the end of every page.

  1. Table of contents. The left sidebar becomes a single, collapsible table
     of contents for the whole note: chapters, then their sections and
     sub-sections, read from outline.json (written by scripts/outline.py).
     The section being read is highlighted as the reader scrolls.

  2. EN | FR switch. en/ and fr/ use the same file names and the same
     anchors, so switching language swaps the page content in place: same
     page, same section, no reload. The choice is remembered for the root
     page redirect (index.qmd).
-->
<script>
(function () {
  "use strict";

  var KEY = "codif-ape-lang";
  var LANGS = ["en", "fr"];
  var STRINGS = {
    en: {
      label: "EN", hint: "Read this page in English", brand: "APE coding · MLOps",
      group: "Language", toc: "Table of contents", expand: "Expand", collapse: "Collapse"
    },
    fr: {
      label: "FR", hint: "Lire cette page en français", brand: "Codification APE · MLOps",
      group: "Langue", toc: "Sommaire", expand: "Déplier", collapse: "Replier"
    }
  };
  // Parts of the page that differ between languages, swapped on a switch.
  var SWAPPED = [
    "main#quarto-document-content",
    "#quarto-margin-sidebar",
    "nav.page-navigation",
    ".nav-footer-center",
    ".quarto-secondary-nav-title"
  ];
  var PATH = /^(.*\/)(en|fr)(\/.*)?$/;

  var m = window.location.pathname.match(PATH);
  if (!m) return;
  var base = m[1];
  var state = { lang: m[2], page: pageOf(m[3]) };

  // "/data.html", "/data" and "/" all name a page; compare them without ".html".
  function pageOf(rest) {
    var page = (rest || "/").replace(/^\//, "").replace(/\.html$/, "");
    return page === "" ? "index" : page;
  }

  function urlFor(lang, page) {
    return base + lang + "/" + page + ".html";
  }

  function el(tag, className, attrs) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    return node;
  }

  // ---------------------------------------------------------------- MathJax

  // Section titles can hold math; MathJax loads after this script.
  function typeset(nodes) {
    var mj = window.MathJax;
    if (mj && mj.startup && mj.startup.promise) {
      return mj.startup.promise.then(function () { return mj.typesetPromise(nodes); });
    }
    if (document.readyState !== "complete") {
      return new Promise(function (resolve) {
        window.addEventListener("load", function () { typeset(nodes).then(resolve); }, { once: true });
      });
    }
    return Promise.resolve();
  }

  // ----------------------------------------------------- Table of contents

  var outline = fetch(base + "outline.json")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .catch(function () { return null; });

  var links = {};       // section id -> link, for the current page
  var activeLink = null;

  function setOpen(li, open) {
    li.classList.toggle("is-open", open);
    var button = li.querySelector(":scope > .toc-row > .toc-toggle");
    if (button) {
      button.setAttribute("aria-expanded", String(open));
      button.setAttribute("aria-label", STRINGS[state.lang][open ? "collapse" : "expand"]);
    }
  }

  function tocItem(node, depth, page, isCurrentPage) {
    var li = el("li", "toc-item toc-depth-" + depth);
    var row = el("div", "toc-row");
    var children = depth === 0 ? node.sections : node.children;

    if (children && children.length) {
      var button = el("button", "toc-toggle", { type: "button" });
      button.addEventListener("click", function () {
        li.dataset.pinned = "1";
        setOpen(li, !li.classList.contains("is-open"));
      });
      row.appendChild(button);
    } else {
      row.appendChild(el("span", "toc-spacer"));
    }

    var a = el("a", "toc-link no-external");
    if (depth === 0) {
      a.href = urlFor(state.lang, page);
      if (node.number) {
        var num = el("span", "toc-number");
        num.textContent = node.number + ".";
        a.appendChild(num);
      }
      a.insertAdjacentHTML("beforeend", node.title);
      if (isCurrentPage) {
        a.classList.add("is-current");
        a.setAttribute("aria-current", "page");
        a.addEventListener("click", function (e) {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
    } else {
      a.href = (isCurrentPage ? "" : urlFor(state.lang, page)) + "#" + node.id;
      a.innerHTML = node.title;
      if (isCurrentPage) links[node.id] = a;
    }
    row.appendChild(a);
    li.appendChild(row);

    if (children && children.length) {
      var ul = el("ul", "toc-children");
      children.forEach(function (child) {
        ul.appendChild(tocItem(child, depth + 1, page, isCurrentPage));
      });
      li.appendChild(ul);
      setOpen(li, false);
    }
    return li;
  }

  function buildToc(data) {
    var container = document.querySelector("#quarto-sidebar .sidebar-menu-container");
    if (!container || !data || !data[state.lang]) return;

    links = {};
    activeLink = null;
    var nav = el("nav", "site-toc", { "aria-label": STRINGS[state.lang].toc });
    var ul = el("ul", "toc-children toc-chapters");
    data[state.lang].forEach(function (chapter) {
      var page = pageOf(chapter.href);
      var isCurrent = page === state.page;
      var li = tocItem(chapter, 0, page, isCurrent);
      if (isCurrent) {
        li.classList.add("is-current");
        setOpen(li, true);
      }
      ul.appendChild(li);
    });
    nav.appendChild(ul);
    container.replaceChildren(nav);
    document.body.classList.add("has-site-toc");

    typeset([nav]);
    updateActive();
    var current = nav.querySelector(".toc-link.is-current");
    if (current) revealInSidebar(current);
  }

  function revealInSidebar(link) {
    var sidebar = document.getElementById("quarto-sidebar");
    if (!sidebar) return;
    var r = link.getBoundingClientRect();
    var s = sidebar.getBoundingClientRect();
    if (r.top < s.top || r.bottom > s.bottom) {
      sidebar.scrollTop += r.top - s.top - s.height / 3;
    }
  }

  function sectionList() {
    return Array.prototype.slice.call(document.querySelectorAll(
      "main#quarto-document-content section.level2[id], main#quarto-document-content section.level3[id]"
    ));
  }

  // The section being read: the last one whose top has scrolled past the
  // navbar.
  function currentSection() {
    var sections = sectionList();
    if (!sections.length) return null;
    var atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
    if (atBottom) return sections[sections.length - 1];
    var current = null;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].getBoundingClientRect().top > 100) break;
      current = sections[i];
    }
    return current;
  }

  function updateActive() {
    var section = currentSection();
    var link = (section && links[section.id]) || null;
    if (link === activeLink) return;
    if (activeLink) activeLink.classList.remove("active");
    activeLink = link;
    if (!link) return;
    link.classList.add("active");

    // Open the branch that holds the active section, and close the branches
    // opened automatically before, unless the reader opened them by hand.
    var branch = [];
    for (var li = link.closest(".toc-item"); li; li = li.parentElement.closest(".toc-item")) {
      branch.push(li);
    }
    document.querySelectorAll(".site-toc .toc-item.is-open").forEach(function (li) {
      if (branch.indexOf(li) === -1 && !li.classList.contains("is-current") && !li.dataset.pinned) {
        setOpen(li, false);
      }
    });
    branch.forEach(function (li) {
      if (li.querySelector(":scope > .toc-children")) setOpen(li, true);
    });
    revealInSidebar(link);
  }

  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function () { ticking = false; updateActive(); });
  }, { passive: true });

  // -------------------------------------------------------- Language switch

  var switchGroup = el("div", "lang-switch", { role: "group" });

  function updateChrome() {
    var s = STRINGS[state.lang];
    var brand = document.querySelector(".navbar-brand");
    if (brand) brand.setAttribute("href", urlFor(state.lang, "index"));
    var brandTitle = document.querySelector(".navbar-title");
    if (brandTitle) brandTitle.textContent = s.brand;
    switchGroup.setAttribute("aria-label", s.group);
    Array.prototype.forEach.call(switchGroup.children, function (a) {
      var lang = a.getAttribute("lang");
      var active = lang === state.lang;
      a.classList.toggle("active", active);
      if (active) a.setAttribute("aria-current", "true");
      else a.removeAttribute("aria-current");
      a.href = urlFor(lang, state.page) + window.location.hash;
    });
  }

  LANGS.forEach(function (lang) {
    var a = el("a", "no-external", { lang: lang, hreflang: lang, title: STRINGS[lang].hint });
    a.textContent = STRINGS[lang].label;
    a.addEventListener("click", function (e) {
      // Let modified clicks open the other language in a new tab.
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      switchLang(lang, true);
    });
    switchGroup.appendChild(a);
  });

  var slot = document.querySelector(".quarto-navbar-tools") ||
             document.querySelector(".navbar-container");
  if (slot) slot.insertBefore(switchGroup, slot.firstChild);

  // Quarto marks external links (icon, new tab) on page load only.
  function adornExternalLinks(root) {
    root.querySelectorAll("a[href]:not(.no-external):not([aria-hidden])").forEach(function (a) {
      if (/^https?:$/.test(a.protocol) && a.origin !== window.location.origin) {
        a.setAttribute("target", "_blank");
        if (a.getAttribute("rel") === null) a.setAttribute("rel", "noopener");
        a.classList.add("external");
      }
    });
  }

  // Same steps as Quarto's mermaid-init.js, which only runs on page load.
  var mermaidCount = 0;
  function renderMermaid(root) {
    var mermaid = window.mermaid;
    if (!mermaid) return Promise.resolve();
    var blocks = Array.prototype.slice.call(root.querySelectorAll("pre.mermaid-js"));
    return blocks.reduce(function (done, pre) {
      return done.then(function () {
        var text = pre.textContent.replace(/&nbsp;/g, " ");
        return mermaid.mermaidAPI.render("mermaid-switch-" + (++mermaidCount), text, pre)
          .then(function (result) {
            pre.innerHTML = result.svg;
            var svg = pre.querySelector("svg");
            if (pre.dataset.label) {
              var style = svg.querySelector("style");
              if (style) style.innerHTML = style.innerHTML.split("#" + svg.id).join("#" + pre.dataset.label + "-mermaid");
              svg.id = pre.dataset.label + "-mermaid";
            }
            pre.parentElement.replaceChild(svg, pre);
            svg.classList.add("mermaid-js");
            /* global _quartoMermaid */
            if (typeof _quartoMermaid !== "undefined") {
              try { _quartoMermaid.postProcess(svg); } catch (e) {}
            }
          });
      });
    }, Promise.resolve());
  }

  var switching = false;
  function switchLang(lang, push) {
    if (lang === state.lang || switching) return;
    switching = true;
    var url = urlFor(lang, state.page);

    // Remember where the reader is, to land at the same place. Both
    // languages have the same sections in the same order, but not always the
    // same ids (those derived from French titles differ), so sections are
    // matched by position.
    var before = sectionList();
    var anchor = currentSection();
    var anchorIndex = before.indexOf(anchor);
    var anchorTop = anchor ? anchor.getBoundingClientRect().top : null;
    var hashIndex = before.findIndex(function (s) { return "#" + s.id === window.location.hash; });
    var scrollY = window.scrollY;

    document.documentElement.classList.add("lang-switching");
    fetch(url)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var after = doc.querySelectorAll(
          "main#quarto-document-content section.level2[id], main#quarto-document-content section.level3[id]"
        );
        var hash = hashIndex >= 0 && after[hashIndex] ? "#" + after[hashIndex].id : window.location.hash;
        state.lang = lang;
        if (push) history.pushState({ lang: lang }, "", url + hash);
        else if (hash !== window.location.hash) history.replaceState(history.state, "", url + hash);
        try { localStorage.setItem(KEY, lang); } catch (e) {}

        SWAPPED.forEach(function (selector) {
          var current = document.querySelector(selector);
          var next = doc.querySelector(selector);
          if (!current || !next) return;
          next.querySelectorAll("script").forEach(function (s) { s.remove(); });
          current.replaceWith(document.importNode(next, true));
        });
        document.title = doc.title;
        document.documentElement.lang = doc.documentElement.lang || lang;
        updateChrome();

        var main = document.querySelector("main#quarto-document-content");
        adornExternalLinks(main);
        return Promise.all([
          renderMermaid(main).catch(function () {}),
          typeset([main]).catch(function () {}),
          outline.then(buildToc)
        ]);
      })
      .then(function () {
        var target = anchorIndex >= 0 ? sectionList()[anchorIndex] : null;
        if (target && anchorTop !== null) {
          window.scrollTo(0, window.scrollY + target.getBoundingClientRect().top - anchorTop);
        } else {
          window.scrollTo(0, scrollY);
        }
        updateActive();
      })
      .catch(function () {
        // Fall back to a normal page load.
        window.location.href = url + window.location.hash;
      })
      .then(function () {
        switching = false;
        document.documentElement.classList.remove("lang-switching");
      });
  }

  // Back and forward between two languages of the same page stay in place.
  window.addEventListener("popstate", function () {
    var mm = window.location.pathname.match(PATH);
    if (!mm) return;
    if (pageOf(mm[3]) !== state.page) {
      window.location.reload();
    } else if (mm[2] !== state.lang) {
      switchLang(mm[2], false);
    }
  });

  try { localStorage.setItem(KEY, state.lang); } catch (e) {}
  updateChrome();
  outline.then(buildToc);
})();
</script>

    }

      if (window.bootstrap) {
        button.setAttribute("data-bs-toggle", "tooltip");
        button.setAttribute("data-bs-placement", "left");
        button.setAttribute("data-bs-title", "Copied!");

      });

    }

    function tippyHover(el, contentFn, onTriggerFn, onUntriggerFn) {

        let href = ref.getAttribute('data-footnote-href') || ref.getAttribute('href');

    const processXRef = (id, note) => {
      // Strip column container classes
      const stripColumnClz = (el) => {

        if (el.children) {
          for (const child of el.children) {

      if (id === null || id.startsWith('sec-')) {
        // Special case sections, only their first couple elements
        const container = document.createElement("div");
        if (note.children && note.children.length > 2) {
          container.appendChild(note.children[0].cloneNode(true));
          for (let i = 1; i < note.children.length; i++) {
            const child = note.children[i];
            if (child.tagName === "P" && child.innerText === "") {
              continue;
            } else {
              container.appendChild(child.cloneNode(true));
              break;
            }
          }
          if (window.Quarto?.typesetMath) {
            window.Quarto.typesetMath(container);
          }
          return container.innerHTML
        } else {

        }
      } else {

              if (note !== null) {
                const html = processXRef(id, note);
                instance.setContent(html);
              } 
            }).finally(() => {
              instance.enable();
              instance.show();
            });
          }
        } else {

          fetch(url)

        let selectedAnnoteEl;

      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
